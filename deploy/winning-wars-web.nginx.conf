server_tokens off;
client_max_body_size 1m;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

location ~ ^/api/v1/admin/(login|logout)$ {
    if ($scheme != https) {
        return 426;
    }

    limit_except POST {
        deny all;
    }

    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://10.0.0.106:8000;
    proxy_http_version 1.1;
    proxy_set_header Host 10.0.0.106;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}

location ~ ^/api/v1/admin/(manual/(proposal|batch)|participation/toggle|tournament/(start|winner|reset))$ {
    if ($scheme != https) {
        return 426;
    }

    limit_except POST {
        deny all;
    }

    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://10.0.0.106:8000;
    proxy_http_version 1.1;
    proxy_set_header Host 10.0.0.106;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}

# A auditoria detalhada contem dados operacionais e agora e exclusiva de admin.
location ^~ /api/audit/ {
    return 404;
}

location /api/ {
    limit_except GET {
        deny all;
    }

    proxy_pass http://10.0.0.106:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host 10.0.0.106;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}

location /assets/ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, immutable";
}

location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}

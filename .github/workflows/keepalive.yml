name: Streamlit Keep Alive

on:
  schedule:
    # Fora do minuto cheio para reduzir atrasos do agendador do GitHub.
    # Duas horas deixam ampla margem antes das 12h de inatividade do Streamlit.
    - cron: "17 */2 * * *"

  # Permite executar manualmente pelo GitHub
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    concurrency:
      group: streamlit-keepalive
      cancel-in-progress: false

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Abrir Streamlit e manter ativo
        env:
          APP_URL: "https://app-winning-wars-jwjuzibnwyejvqmcwyvge8.streamlit.app/"
        run: |
          python <<EOF
          import os
          from playwright.sync_api import TimeoutError as PlaywrightTimeoutError
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              print("Abrindo:", url)

              response = page.goto(url, wait_until="domcontentloaded", timeout=90000)
              page.wait_for_timeout(5000)

              final_url = page.url.lower()
              if "/auth/" in final_url or "/login" in final_url:
                  raise RuntimeError(
                      "Keep-alive bloqueado pela autenticação do Streamlit: "
                      + page.url
                  )
              if response is None or response.status >= 400:
                  status = "sem resposta" if response is None else response.status
                  raise RuntimeError(f"Resposta inicial inválida: {status}")

              # Quando o app já hibernou, tenta a ação pública de reativação.
              wake = page.get_by_text("Yes, get this app back up!", exact=False)
              if wake.count() and wake.first.is_visible():
                  wake.first.click()
                  page.wait_for_timeout(10000)

              # A página externa do Community Cloud carrega o app neste iframe.
              # Exigir o iframe impede que login, erro ou página intermediária
              # sejam registrados como sucesso.
              try:
                  iframe = page.locator('iframe[title="streamlitApp"]')
                  iframe.wait_for(state="visible", timeout=120000)
                  frame = iframe.content_frame
                  frame.locator("body").wait_for(state="visible", timeout=120000)
              except PlaywrightTimeoutError as exc:
                  raise RuntimeError(
                      "O processo Streamlit não carregou dentro do prazo"
                  ) from exc

              page.wait_for_timeout(15000)
              print("App Streamlit carregado e sessão de usuário confirmada")

              browser.close()
          EOF
